<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline | Sim Baking House</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    background: #FAF8F5;
    color: #1F1D1B;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
  }
  p {
    margin: 0;
    max-width: 320px;
    line-height: 1.5;
    color: #1F1D1B;
    opacity: 0.7;
  }
  button {
    margin-top: 8px;
    padding: 10px 24px;
    border-radius: 999px;
    border: 1px solid #7A4031;
    background: #7A4031;
    color: #FAF8F5;
    font-size: 15px;
    cursor: pointer;
  }
  button:active {
    opacity: 0.85;
  }
</style>
</head>
<body>
  <h1>You're offline</h1>
  <p>Sim Baking House needs an internet connection to load the menu and take orders. Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
